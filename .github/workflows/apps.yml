# The desktop apps (install/app/build.py): one SMTV.app in a .dmg for every Mac (Apple silicon and Intel), the Windows installer
# (.exe, Inno Setup) and the Windows ZIP without installation. Each is checked without a window (install/app/smoke.py):
# the app's own Python, its ffmpeg with captions, `smtv doctor` and `smtv serve`; the Windows one after a real silent
# install. Not signed yet (stage 30: SignPath for Windows, Apple Developer ID for macOS).
# Runs by hand (Actions → apps → Run workflow) and from release.yml, which puts the files on the release.
name: apps

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SMTV_APP_KEY:
        required: true         # the key our server checks when a link is downloaded; the apps are built with it

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15          # Apple silicon; the Intel Python of the same app is built and checked here under Rosetta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Rosetta, for the Intel Python (without it that half could not be checked and the job stops)
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true
      - name: The app key, from the secret, into a generated git-ignored module (it is in the apps, never in the repository)
        env:
          SMTV_APP_KEY: ${{ secrets.SMTV_APP_KEY }}
        run: uv run --no-project python scripts/write_appkey.py
      - run: uv build --all-packages --wheel --out-dir dist
      - run: uv run --no-project python scripts/write_appkey.py --verify dist
      - run: uv run --no-project python install/app/build.py mac --wheels dist --release
      # the app exactly as people get it: from the mounted .dmg; both of its Pythons
      - name: Both Pythons of SMTV.app, from the .dmg
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" build/app/SMTV-*-mac.dmg
          uv run --no-project python install/app/smoke.py "$mnt/SMTV.app" --arch arm64
          uv run --no-project python install/app/smoke.py "$mnt/SMTV.app" --arch x86_64
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-mac
          path: build/app/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: The app key, from the secret, into a generated git-ignored module (it is in the apps, never in the repository)
        env:
          SMTV_APP_KEY: ${{ secrets.SMTV_APP_KEY }}
        run: uv run --no-project python scripts/write_appkey.py
      - run: uv build --all-packages --wheel --out-dir dist
      - run: uv run --no-project python scripts/write_appkey.py --verify dist
      - name: ClipIt.exe is built from install/app/launcher_win.c with MinGW-w64, which the runner has
        shell: pwsh
        run: |
          gcc --version
          windres --version
      - run: uv run --no-project python install/app/build.py win-x64 --wheels dist --release
      - name: The ZIP, unpacked as a person would
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/app/SMTV-*-windows-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\zip"
          uv run --no-project python install/app/smoke.py "$env:RUNNER_TEMP\zip\ClipIt" --kind zip
          if ($LASTEXITCODE -ne 0) { throw "the ZIP failed its check" }
      # ClipIt.exe is our own launcher (install/app/launcher_win.c), not a copy of Python's program: its version info is
      # the app's, and it is not python.org's pythonw.exe (the signing step, when there is one, signs only this file).
      - name: ClipIt.exe in the ZIP is the launcher built here, with the icon and version info
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'zip\ClipIt'
          $v = (Select-String -Path packages/smtv/pyproject.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $info = (Get-Item -LiteralPath (Join-Path $app 'ClipIt.exe')).VersionInfo
          if ($info.ProductName -ne 'Clip It!' -or $info.CompanyName -ne 'yuriti' -or $info.FileVersion -ne $v) {
            throw "ClipIt.exe version info is $($info.ProductName) / $($info.CompanyName) / $($info.FileVersion), expected Clip It! / yuriti / $v"
          }
          $a = (Get-FileHash -LiteralPath (Join-Path $app 'ClipIt.exe')).Hash
          $b = (Get-FileHash -LiteralPath (Join-Path $app 'app\pythonw.exe')).Hash
          if ($a -eq $b) { throw "ClipIt.exe is a copy of pythonw.exe, not the launcher" }
          "ClipIt.exe: $($info.ProductName), $($info.CompanyName), $($info.FileVersion), $((Get-Item -LiteralPath (Join-Path $app 'ClipIt.exe')).Length) bytes"
      # Smart App Control lets a signed program run whatever its reputation: Python's own program and libraries must be
      # python.org's, signed by the Python Software Foundation. ClipIt.exe is ours and unsigned until it is signed
      # (SignPath). The other unsigned files are listed to watch.
      - name: Python's program and libraries are python.org's, signed by the Python Software Foundation
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'zip\ClipIt'
          foreach ($name in 'app\pythonw.exe', 'python312.dll', 'python3.dll') {
            $s = Get-AuthenticodeSignature -LiteralPath (Join-Path $app $name)
            $who = if ($s.SignerCertificate) { $s.SignerCertificate.Subject } else { 'nobody' }
            if ($s.Status -ne 'Valid' -or $who -notlike '*O=Python Software Foundation*') {
              throw "${name} is not signed by the Python Software Foundation: $($s.Status), $who"
            }
            "${name}: $($s.Status), $who"
          }
          "Programs and libraries without a valid signature (watched, not a failure):"
          Get-ChildItem -LiteralPath $app -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll', '.pyd' } | ForEach-Object {
            $s = Get-AuthenticodeSignature -LiteralPath $_.FullName
            if ($s.Status -ne 'Valid') { "  $($s.Status)  $($_.FullName.Substring($app.Length + 1))" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-windows
          path: build/app/*.zip
          if-no-files-found: error
