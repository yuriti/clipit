# The desktop apps (install/app/build.py): one SMTV.app in a .dmg for every Mac (Apple silicon and Intel), the Windows installer
# (.exe, Inno Setup) and the Windows ZIP without installation. Each is checked without a window (install/app/smoke.py):
# the app's own Python, its ffmpeg with captions, `smtv doctor` and `smtv serve`; the Windows one after a real silent
# install. Not signed yet (stage 30: SignPath for Windows, Apple Developer ID for macOS).
# Runs by hand (Actions → apps → Run workflow) and from release.yml, which puts the files on the release.
name: apps

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15          # Apple silicon; the Intel Python of the same app is built and checked here under Rosetta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Rosetta, for the Intel Python (without it that half could not be checked and the job stops)
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true
      - run: uv build --all-packages --wheel --out-dir dist
      - run: uv run --no-project python install/app/build.py mac --wheels dist --release
      # the app exactly as people get it: from the mounted .dmg; both of its Pythons
      - name: Both Pythons of SMTV.app, from the .dmg
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" build/app/SMTV-*-mac.dmg
          uv run --no-project python install/app/smoke.py "$mnt/SMTV.app" --arch arm64
          uv run --no-project python install/app/smoke.py "$mnt/SMTV.app" --arch x86_64
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-mac
          path: build/app/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest    # Inno Setup 6 is preinstalled on GitHub's Windows machines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv build --all-packages --wheel --out-dir dist
      - run: uv run --no-project python install/app/build.py win-x64 --wheels dist --release
      - name: The ZIP, unpacked as a person would
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/app/SMTV-*-windows-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\zip"
          uv run --no-project python install/app/smoke.py "$env:RUNNER_TEMP\zip\SMTV" --kind zip
          if ($LASTEXITCODE -ne 0) { throw "the ZIP failed its check" }
      - name: The installer, installed silently for this user, checked, then removed
        shell: pwsh
        run: |
          $setup = Get-ChildItem build/app/SMTV-*-windows-x64-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer was made" }
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer ended with $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\SMTV'
          if (-not (Test-Path (Join-Path $app 'SMTV.exe'))) { throw "SMTV.exe is not in $app" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'SMTV.lnk'))) { throw "no Start menu icon" }
          uv run --no-project python install/app/smoke.py $app --kind exe
          if ($LASTEXITCODE -ne 0) { throw "the installed app failed its check" }
          $u = Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "the uninstaller ended with $($u.ExitCode)" }
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $app 'SMTV.exe')) { throw "the uninstaller left SMTV.exe" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-windows
          path: |
            build/app/*-setup.exe
            build/app/*.zip
          if-no-files-found: error
