# By hand (Actions → smart-app-control → Run workflow): does Smart App Control (Windows 11) let SMTV run? GitHub's
# Windows machine gets Windows' own example policy of Smart App Control (SmartAppControl.xml; else the closest one,
# SignedReputable.xml: signed or reputable code only), enforced without a restart. Then install/app/sac_check.py tries
# the release's installer, its ZIP and the one-line install/install.ps1 of this branch, and writes which file was
# blocked, with Windows' CodeIntegrity events: the job summary and the artifact sac-report. Nothing is published.
# A GitHub machine is not a person's computer: the cloud reputation Smart App Control asks may answer differently here.
name: smart-app-control

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release whose installer and ZIP are checked"
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"   # python.org's build, signed: it runs the checks under the policy
      - name: Before the policy - the release, an install to look at, a program nobody signed, the signatures
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $w = Join-Path $env:RUNNER_TEMP 'sac'
          New-Item -ItemType Directory -Force $w | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'SMTV-windows-setup.exe' --pattern 'SMTV-windows.zip' --dir $w
          if ($LASTEXITCODE -ne 0) { throw "could not download the release $env:TAG" }
          Expand-Archive (Join-Path $w 'SMTV-windows.zip') -DestinationPath (Join-Path $w 'zip')
          $p = Start-Process (Join-Path $w 'SMTV-windows-setup.exe') -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$w\installed"
          "installed before the policy: exit $($p.ExitCode)"
          # the control: a program made right now, so no signature and no reputation; the policy must block it
          $cs = Join-Path $w 'control.cs'
          Set-Content $cs "class P { static void Main() { System.Console.WriteLine(""SMTV control $env:GITHUB_RUN_ID""); } }"
          & "$env:windir\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo "/out:$w\control.exe" $cs
          if ($LASTEXITCODE -ne 0) { throw "could not make the control program" }
          python install/app/sac_check.py signatures --out (Join-Path $w 'signatures.json') (Join-Path $w 'zip\SMTV') (Join-Path $w 'installed')
      - name: The policy, enforced
        shell: pwsh
        run: |
          $w = Join-Path $env:RUNNER_TEMP 'sac'
          $dir = Join-Path $env:windir 'schemas\CodeIntegrity\ExamplePolicies'
          "Example policies here:"; Get-ChildItem $dir -Name
          $name = 'SmartAppControl.xml', 'SignedReputable.xml' | Where-Object { Test-Path (Join-Path $dir $_) } | Select-Object -First 1
          if (-not $name) { throw "neither SmartAppControl.xml nor SignedReputable.xml is in ${dir}: no policy like Smart App Control here" }
          $xml = Join-Path $w 'policy.xml'
          Copy-Item (Join-Path $dir $name) $xml
          Set-CIPolicyIdInfo -FilePath $xml -ResetPolicyID | Out-Null    # its own id, never Windows' own one
          Set-CIPolicyIdInfo -FilePath $xml -PolicyName "SMTV check: $name"
          Set-RuleOption -FilePath $xml -Option 3 -Delete    # enforced, not audit
          Set-RuleOption -FilePath $xml -Option 6            # the policy file itself is not signed
          Set-RuleOption -FilePath $xml -Option 16           # no restart
          "Rule options:"; ([xml](Get-Content $xml)).SiPolicy.Rules.Rule.Option
          $id = ([xml](Get-Content $xml)).SiPolicy.PolicyID
          $cip = Join-Path $w "$id.cip"
          ConvertFrom-CIPolicy -XmlFilePath $xml -BinaryFilePath $cip | Out-Null
          # the reputation check (ISG) needs these, as on a person's computer
          appidtel.exe start
          sc.exe config appidsvc start= auto
          Start-Service appidsvc -ErrorAction Continue
          if (-not (Get-Command CiTool.exe -ErrorAction SilentlyContinue)) { throw "no CiTool.exe on this Windows: a policy cannot be put in place without a restart" }
          CiTool.exe --update-policy $cip
          if ($LASTEXITCODE -ne 0) { throw "CiTool could not put the policy in place ($LASTEXITCODE)" }
          CiTool.exe --list-policies | Out-File (Join-Path $w 'policies.txt') -Encoding utf8
          # install.ps1 asks this value whether Smart App Control is on (1: on)
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\CI\Policy' -Name VerifiedAndReputablePolicyState -Value 1 -PropertyType DWord -Force | Out-Null
          Set-Content (Join-Path $w 'policy-name.txt') "$name (enforced, policy id $id)"
      - name: Under the policy - the installer, the ZIP, install.ps1
        shell: pwsh
        run: python install/app/sac_check.py run --work (Join-Path $env:RUNNER_TEMP 'sac') --repo .
      - name: Every CodeIntegrity event of this run
        if: always()
        shell: pwsh
        run: Get-WinEvent -LogName 'Microsoft-Windows-CodeIntegrity/Operational' -MaxEvents 300 -ErrorAction Continue | Format-Table TimeCreated, Id, Message -Wrap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sac-report
          path: |
            ${{ runner.temp }}/sac/report.md
            ${{ runner.temp }}/sac/report.json
            ${{ runner.temp }}/sac/signatures.json
            ${{ runner.temp }}/sac/policy.xml
            ${{ runner.temp }}/sac/policies.txt
            ${{ runner.temp }}/sac/setup.log
          if-no-files-found: warn
